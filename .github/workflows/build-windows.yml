name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.5 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.5_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.5_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.5.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.5
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.5 (1:1 原版复刻模型组回退与用量版)
          tag_name: v1.13.0.5
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.5 (1:1 原版复刻设置中心 + 模型组 Fallback + Token 用量统计)
            > **⚠️ 备注：私人用极度不稳定 Aicoding 改**
            
            - **1:1 原版设置架构 (对标截图 1000143310)**：大圆角 Grouped 卡片，完整导航 (管理提供商、模型组、Token用量、MCP、记忆、存储共享文件夹)
            - **模型组与回退机制 (Fallback，对标截图 1000143328)**：支持配置 Primary 主力组与备选队列，主模型报错自动毫秒级平滑回退
            - **Token 用量统计仪表盘 (对标截图 1000143344)**：总输入 (含缓存)、输出 Token、缓存读取、缓存命中率，各模型输入/输出消耗排行
            - **AI 服务商分层管理 (对标截图 1000143326)**：绿色圆点状态、Key 脱敏、模型数统计、一键拉取模型池
            - **会话主列表与右上角菜单 (对标截图 1000143307)**：马卡龙圆形图标徽章、按时间分段、右上角经典菜单
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
