name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.3 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.3_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.3_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.3.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.3
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.3 (Exp - 私人用极度不稳定 Aicoding 改)
          tag_name: v1.13.0.3
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.3 (多模态图文输入 + 多供应商管理 + 思考模式与强度 + MCP 扩展)
            > **⚠️ 备注：私人用极度不稳定 Aicoding 改**
            
            - **思考链与强度调节**：流式解析 reasoning_content / <think>，折叠卡片展示思考过程，支持 OFF/Low/Med/High/Max
            - **回复与输入中状态**：动态脉冲动画与状态提示，彻底告别盲等
            - **图文混排联合发送**：输入框支持同时输入文字与附带文件/图片，管道流式安全写入沙箱
            - **多供应商与偏好分离**：独立管理 OpenAI、DeepSeek、Claude、SiliconFlow、Ollama 等，各自独立 Base URL 与 Key
            - **MCP 扩展协议管理**：支持集成 Stdio / SSE 外部 MCP 服务与工具
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
