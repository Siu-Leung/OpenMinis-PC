name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.9 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.9_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.9_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.9.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.9
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.9 (Windows 测试版)
          tag_name: v1.13.0.9
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.9 (1:1 深度复刻原版服务商中心 + 聊天框模型与提供商全显 + 数学公式/代码块沙箱执行)
            > **⚠️ 备注：Windows 测试版 (Experimental)**
            
            - **1:1 原版 AI 服务商中心**：深度对标原版截图，支持分级卡片、绿灯状态感知、Key 掩码脱敏、主流推荐预设（DeepSeek、OpenAI、SiliconFlow、Ollama、Moonshot）、自定义 /v1 自动追加、延迟 Ping 测试与模型在线刷新
            - **聊天框提供商全显**：顶栏与消息流完整展示「提供商名称 / 模型」，下拉模型池智能按提供商分组归类
            - **代码块沙箱一键运行**：点击代码块右上角【沙箱运行】即可在 WSL2 Alpine 真实执行并内联查看 Stdout/Stderr
            - **全量 KaTeX 数学方程式渲染**：行内与块级 LaTeX 公式原生呈现
            - **生成中止 (Stop Button)**：聊天输入栏支持实时停止生成流
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
