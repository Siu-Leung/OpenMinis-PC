name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.15 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.15_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.15_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.15.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.15
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.15 (Windows 测试版)
          tag_name: v1.13.0.15
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.15 (环境变量 + 截图修复 + 流式优化 + 多模态检测 + Agent 供应商管理)
            > **⚠️ 备注：Windows 测试版 (Experimental)**
            
            - **环境变量管理**：新增环境变量设置项（对标原版 EnvironmentVariablesScreen），配置的变量自动注入沙箱 shell 执行
            - **修复截图发不出图片**：Edge 截图直写沙箱 UNC 路径，Agent 在沙箱内可直接访问（根因：宿主机/沙箱路径不一致）
            - **流式渲染优化**：流式时改用轻量纯文本渲染，消除 Markdown 全量解析导致的卡顿闪烁，完成后才渲染 Markdown
            - **模型错误友好化**：提取 LLM 错误 JSON 的 message 字段，友好展示 cooldown/限流等错误
            - **修复多模态检测误判**：发纯红图问颜色真实验证（对标原版 looksBlind），修复所有模型都被误判「支持图文」
            - **Agent 供应商管理**：供应商迁移后端 + list_providers/add_provider 工具
            - **统一设计规范**：语义化 CSS 变量 + 主题切换修复 + 聊天 UI 颜色对齐原版
            - **浮动工具状态栏**：输入栏上方工具执行状态条（对标原版 FloatingToolBar）
            - **自动添加 /v1 修复** + **日志系统接入真实写入与开关**
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
