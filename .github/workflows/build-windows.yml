name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.8 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.8_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.8_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.8.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.8
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.8 (Windows 测试版)
          tag_name: v1.13.0.8
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.8 (修复外部链接跳转 + 可视化沙箱终端安装 + 浏览器全网支持)
            > **⚠️ 备注：Windows 测试版 (Experimental)**
            
            - **修复外部链接跳转**：彻底修复「反馈问题」与「GitHub 仓库」点击不跳转的问题，使用系统外壳直接在 Edge/Chrome 中打开
            - **解决浏览器拒绝连接 (X-Frame-Options)**：提供一键在系统默认浏览器中打开按钮与顶栏地址栏跳转，支持访问 Bing、百度、GitHub 等所有带安全防护的网站
            - **修复终端点击无反应**：Shell 终端唤起前置错误捕获，未安装沙箱时弹出友好引导，不再静默无声
            - **解决沙箱安装重置无反应**：Rootfs 沙箱管理页面未安装状态下新增醒目的【⚡ 唤起终端窗口可视化安装】按钮，直接弹出一个独立的控制台窗口，实时滚动清华源下载与解压进度
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
