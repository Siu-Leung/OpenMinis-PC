name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.10 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.10_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.10_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.10.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.10
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.10 (Windows 测试版)
          tag_name: v1.13.0.10
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.10 (1:1 原版模型分组/回退策略 + 外部目录原生手选 + 图片/快照直接渲染 + 答案便捷复制 + 拖拽全支持)
            > **⚠️ 备注：Windows 测试版 (Experimental)**
            
            - **1:1 原版模型分组与回退系统 (Model Groups)**：深度对标官方截图，支持创建多模型分组、路由策略（回退 / 负载均衡）、Fallback 触发条件（默认 / 始终）、模型排序与提供商标签、会话默认值（启用思考、思考强度、限制上下文窗口、最大上下文）以及 Defaults 系统默认分配与 Minis 运行时可见模型管理
            - **挂载外部目录支持手动选择**：添加外部挂载时提供醒目的【选择文件夹】按键，直接唤起 Windows 系统原生文件夹浏览对话框，自动填入宿主绝对路径并智能提取别名
            - **聊天窗口图片与快照直接显示**：彻底解决无法发送或展示截图的问题，自动识别 `minis://attachments/`、`/var/minis/` 与本地快照，支持点击全屏灯箱放大与保存
            - **答案一键便捷复制**：每条 Assistant 消息下方常驻复制按键，带绿标反馈
            - **原生文件拖拽全面生效**：开启 Windows 级 `dragDropEnabled` 并融合 Tauri 原生事件与 HTML5 drop，随意拖拽文件即可无感上传至沙箱工作区
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
