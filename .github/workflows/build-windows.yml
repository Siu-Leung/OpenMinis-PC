name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.11 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.11_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.11_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.11.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.11
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.11 (Windows 测试版)
          tag_name: v1.13.0.11
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.11 (单次任务流聚合 + Minis Computer 实时画中画/手动介入 + 大模型视觉盲区修复 + 模型多模态图文双测 + 日志系统与备份恢复)
            > **⚠️ 备注：Windows 测试版 (Experimental)**
            
            - **聚合单次任务流 (Turn-Level Aggregation)**：彻底消灭重复工具刷屏，一次交互内所有工具执行收纳于紧凑折叠胶囊，最终答案底部常驻单一复制按键
            - **Minis Computer 实时画中画小电脑**：左下角浮现微型虚拟电脑，实时呈现终端黑框字符流与网页渲染画面；配备【🛑 手动介入 (Take Over)】功能，一键弹出交互窗口轻松扫码、滑块过验证，完成后一键交还 Agent 继续任务
            - **修复大模型视觉盲区**：发送图片自动装配 OpenAI / Gemini 官方标准多模态 `image_url` 结构，大模型真实看见图片内容
            - **修复沙箱图片/截图本地渲染**：增强图像协议跨沙箱直接拉取 WSL 内部附件，天气图与截屏在聊天流高清直出
            - **模型图文多模态双测**：在模型选择器与提供商配置中增加 ⚡ 闪电按钮，一键测试网络延迟与图片多模态兼容性，精准点亮 `img` 徽章
            - **新建对话纯净优化**：移除多余欢迎文字，默认自动继承 Primary 模型或上次选用模型
            - **1:1 原版日志系统与备份恢复**：支持每日日志自动轮转与一键导出；支持 `.minisbak` 全模块打包与一键导入恢复
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
