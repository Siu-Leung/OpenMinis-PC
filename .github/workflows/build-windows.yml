name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否自动创建 GitHub Release 发布安装包'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'src/windows/**'
      - '.github/workflows/build-windows.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OpenMinis for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/windows/package.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src/windows/src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd src/windows
          npm install

      - name: Build Windows Binary & Installer (Tauri v2)
        run: |
          cd src/windows
          npm run tauri build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 收集 nsis exe 安装包、msi 安装包与独立二进制文件
          find src/windows/src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \;
          find src/windows/src-tauri/target/release/ -maxdepth 1 -type f -name "openminis-windows.exe" -exec cp {} dist-artifacts/ \;
          # 为安装包统一建立 1.13.0.13 后缀别名文件
          for f in dist-artifacts/*setup.exe; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.13_x64-setup.exe; done
          for f in dist-artifacts/*.msi; do [ -f "$f" ] && cp "$f" dist-artifacts/OpenMinis_1.13.0.13_x64_en-US.msi; done
          cp dist-artifacts/openminis-windows.exe dist-artifacts/openminis-windows-v1.13.0.13.exe 2>/dev/null || true
          ls -lh dist-artifacts/

      - name: Upload Windows Installers (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-Windows-Installer
          path: dist-artifacts/*
          retention-days: 14

      - name: Update GitHub Release v1.13.0.13
        uses: softprops/action-gh-release@v2
        with:
          name: OpenMinis Windows v1.13.0.13 (Windows 测试版)
          tag_name: v1.13.0.13
          body: |
            ### 📦 OpenMinis for Windows v1.13.0.13 (修复自动添加/v1 + 日志系统接入真实写入与开关)
            > **⚠️ 备注：Windows 测试版 (Experimental)**
            
            - **修复「自动添加 /v1」bug**：统一采用原版 effectiveBaseURL 语义（先去除尾斜杠再判断），修复尾斜杠导致的 `/v1//v1` 重复追加 404；后端移除硬编码域名白名单，改读 `auto_append_v1` 开关，自定义域名也能正确追加
            - **日志系统接入真实写入**：Agent 模型调用、故障回退、错误、工具执行等关键节点现在真正写入日志文件，不再空转
            - **日志开关真正生效**：新增 `set_logging_enabled` 持久化命令，「启用日志」开关实时控制写入，重启后状态保留
            - **日志保留策略**：每日轮转 + 15 天自动清理过期日志（对标原版 pruneOldLogs）
            - **删除日志语义修正**：删除所有日志后不再立即重建文件
          files: dist-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
